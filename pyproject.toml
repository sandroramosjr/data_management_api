[project]
name = "data-management-api"
version = "1.0.0"
description = "API REST para manipulação e persistência de dados em banco relacional SQL."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
